name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Sandbox tests run against real Daytona and are skipped when the key is missing.
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @proofwork/web build

  migrate:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DEV_SESSION_POOLER: ${{ secrets.SUPABASE_DEV_SESSION_POOLER }}
      SUPABASE_PROD_SESSION_POOLER: ${{ secrets.SUPABASE_PROD_SESSION_POOLER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @proofwork/db migrate dev
      - run: pnpm --filter @proofwork/db migrate prod
